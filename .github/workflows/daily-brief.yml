name: Battery Recycling Daily Brief

on:
  schedule:
    # UTC 02:37 = KST 11:37 (평일)
    # SMM 코발트 갱신(11:30 KST) 이후 + GFEX 1절 장중(10:00~11:15 KST)
    # 러너 지연이 붙으면 실제 실행은 11:37~13:00 KST 사이
    - cron: '37 2 * * 1-5'
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  send-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install chromium

      - name: Run BRDB
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL:           ${{ secrets.TO_EMAIL }}
          BCC_EMAIL:          ${{ secrets.BCC_EMAIL }}
        run: python brdb.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "brief $(date +%F)"
          git pull --rebase --autostash
          git push